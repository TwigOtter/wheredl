<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wheredl</title>
  </head>
<body>
  <div id="app">
    <h1 id="title">Wheredl</h1>

    <div id="goal-view-container" class="panel">
      <arcgis-map id="goal-view"></arcgis-map>
    </div>

    <!-- item-id is Esri's "Imagery Hybrid" web map: World Imagery plus a
         reference layer carrying place labels, which the labels option
         toggles. The goal view deliberately stays label-free. -->
    <div id="interaction-view-container" class="panel">
      <arcgis-map
        id="interaction-view"
        item-id="86265e5a4bbb4187a59719cf134e0018"
      >
        <arcgis-scale-bar
          id="interaction-scale-bar"
          slot="bottom-right"
          unit="dual"
        ></arcgis-scale-bar>
      </arcgis-map>
    </div>

    <div id="guess-list-container" class="panel">
      <p id="round-status">Loading today's city…</p>
      <div id="actions">
        <button id="copy-results" type="button" hidden>Copy Results</button>
        <button id="give-another" type="button">Give Me Another! (playtest)</button>
        <button id="options-button" type="button">Options</button>
      </div>
    </div>
  </div>
  <div id="expand-backdrop"></div>

  <dialog id="options-dialog">
    <h2>Options</h2>
    <p class="options-hint">Playtest helpers for the guess map. Your choices stick between rounds.</p>
    <label class="option">
      <input id="option-scale-bar" type="checkbox" />
      <span>Scale bar</span>
    </label>
    <label class="option">
      <input id="option-labels" type="checkbox" />
      <span>Place labels</span>
    </label>
    <button id="options-close" type="button">Done</button>
  </dialog>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
